[package]
name = "windows-pet"
version = "1.0.0"
description = "Windows轻量待办提醒桌宠软件"
authors = ["WindowsPet Contributors"]
license = "MIT"
repository = "https://github.com/your-username/windows-pet"
keywords = ["tauri", "desktop-pet", "todo", "windows", "reminder"]
categories = ["desktop-applications"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "windows_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"

# Windows 专用依赖
[target."cfg(windows)".dependencies]
windows = { version = "0.54", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
] }
winreg = "0.52"
tauri-plugin-autostart = "2.0"

[features]
# 默认开启自定义协议
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
