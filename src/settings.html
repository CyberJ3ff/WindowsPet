<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>设置</title>
<link rel="stylesheet" href="panel.css"/>
</head>
<body class="settings-page">
<div class="panel">
  <header class="panel-header">
    <h2>⚙️ 桌宠设置</h2>
    <button class="btn btn-sm btn-close" id="btn-close" title="关闭">✕</button>
  </header>

  <form id="settings-form" class="form-card" onsubmit="return false;">
    <div class="row">
      <label>空闲提醒超时（分钟）
        <span class="tip">系统空闲超过此时间且有未完成待办 → 桌宠提醒</span>
      </label>
      <input type="number" id="s-idle" min="1" max="720" value="5"/>
    </div>

    <div class="row">
      <label>提醒冷却间隔（秒）
        <span class="tip">同一次空闲周期内避免重复弹窗骚扰</span>
      </label>
      <input type="number" id="s-cooldown" min="5" max="3600" value="30"/>
    </div>

    <div class="row">
      <label>每日主动提醒时间
        <span class="tip">每天到该时间提醒"是否创建今日待办"</span>
      </label>
      <input type="time" id="s-daily" value="09:00"/>
    </div>

    <div class="row two-col">
      <label class="switch-row">
        <span>开机自启</span>
        <input type="checkbox" id="s-autostart"/>
      </label>
      <label class="switch-row">
        <span>窗口总是置顶</span>
        <input type="checkbox" id="s-top" checked/>
      </label>
    </div>

    <div class="row two-col">
      <label class="switch-row">
        <span>提醒音效（默认关闭）</span>
        <input type="checkbox" id="s-sound"/>
      </label>
      <div>
        <label>桌宠缩放比例</label>
        <input type="range" id="s-scale" min="0.5" max="2" step="0.1" value="1"/>
        <span id="s-scale-val" class="muted">1.0x</span>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" id="btn-save">💾 保存设置</button>
      <button class="btn" id="btn-reset" type="button">恢复默认</button>
    </div>
  </form>

  <section class="form-card">
    <h3>🔧 其他操作</h3>
    <div class="row two-col">
      <button class="btn" id="btn-show-pet">显示桌宠</button>
      <button class="btn" id="btn-hide-pet">隐藏桌宠</button>
    </div>
    <div class="row two-col">
      <button class="btn" id="btn-open-data">打开数据目录</button>
      <button class="btn btn-danger" id="btn-exit">退出程序</button>
    </div>
  </section>
</div>
<script src="panel.js"></script>
<script>
(function() {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSettingsPanel);
  } else {
    initSettingsPanel();
  }
})();
</script>
</body>
</html>
