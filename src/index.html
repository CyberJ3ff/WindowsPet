<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows Pet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 容器：桌宠整体（可拖拽区域） -->
  <div id="pet-root" class="pet-root">

    <!-- 气泡提示（默认隐藏，触发时显示） -->
    <div id="bubble" class="bubble hidden">
      <div class="bubble-text" id="bubble-text">你好呀～</div>
      <div class="bubble-actions" id="bubble-actions" style="display:none;">
        <button class="btn" id="btn-snooze">延后10分钟</button>
        <button class="btn btn-primary" id="btn-open-todo">查看待办</button>
        <button class="btn btn-primary" id="btn-create-todo">创建今日待办</button>
      </div>
      <div class="bubble-list" id="bubble-list" style="display:none;">
        <!-- 未完成待办列表动态渲染 -->
      </div>
      <div class="bubble-tail"></div>
    </div>

    <!-- 桌宠形象本体（使用CSS/SVG绘制简单几何形象，方便后续替换序列帧） -->
    <div id="pet-body" class="pet-body state-idle" data-state="idle">
      <!-- 预留接口：如果有自定义序列帧，可把下面 SVG 替换为 <img class="pet-sprite" src="sprite.png"> 并在CSS中控制动画 -->
      <div class="pet-sprite-slot">
        <!-- 简单几何图形版桌宠（一只可爱的小方块） -->
        <svg class="pet-svg" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
          <!-- 阴影 -->
          <ellipse class="shadow" cx="60" cy="148" rx="38" ry="7" fill="rgba(0,0,0,0.25)" />
          <!-- 身体 -->
          <g class="body-group">
            <rect class="body" x="20" y="38" width="80" height="90" rx="22" ry="22"
                  fill="#ffb74d" stroke="#e65100" stroke-width="2.5"/>
            <!-- 肚子 -->
            <rect x="32" y="62" width="56" height="54" rx="18" ry="18" fill="#fff3e0"/>
            <!-- 腮红 -->
            <circle class="cheek cheek-l" cx="32" cy="84" r="6" fill="#ffab91" opacity="0.85"/>
            <circle class="cheek cheek-r" cx="88" cy="84" r="6" fill="#ffab91" opacity="0.85"/>
            <!-- 眼睛 -->
            <g class="eye eye-l">
              <ellipse cx="44" cy="72" rx="6.5" ry="8" fill="#fff"/>
              <circle class="pupil" cx="45" cy="73" r="3.8" fill="#3e2723"/>
              <circle class="shine" cx="43.2" cy="71" r="1.3" fill="#fff"/>
            </g>
            <g class="eye eye-r">
              <ellipse cx="76" cy="72" rx="6.5" ry="8" fill="#fff"/>
              <circle class="pupil" cx="77" cy="73" r="3.8" fill="#3e2723"/>
              <circle class="shine" cx="75.2" cy="71" r="1.3" fill="#fff"/>
            </g>
            <!-- 嘴巴 -->
            <path class="mouth" d="M52 96 Q60 104 68 96" stroke="#4e342e" stroke-width="2.5"
                  fill="none" stroke-linecap="round"/>
          </g>
          <!-- 小耳朵 / 呆毛 -->
          <g class="antenna">
            <line x1="60" y1="38" x2="60" y2="22" stroke="#e65100" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="60" cy="19" r="4.5" fill="#ff7043"/>
          </g>
          <!-- 小手 -->
          <g class="hand hand-l"><rect x="10" y="70" width="12" height="22" rx="6" fill="#ffb74d" stroke="#e65100" stroke-width="2"/></g>
          <g class="hand hand-r"><rect x="98" y="70" width="12" height="22" rx="6" fill="#ffb74d" stroke="#e65100" stroke-width="2"/></g>
          <!-- 小脚 -->
          <rect x="36" y="128" width="18" height="14" rx="6" fill="#e65100"/>
          <rect x="66" y="128" width="18" height="14" rx="6" fill="#e65100"/>
        </svg>
      </div>
    </div>

    <!-- 右键菜单（默认隐藏） -->
    <div id="ctx-menu" class="ctx-menu hidden">
      <div class="ctx-menu-item" data-action="todo">待办管理</div>
      <div class="ctx-menu-item" data-action="settings">设置</div>
      <div class="ctx-menu-sep"></div>
      <div class="ctx-menu-item" data-action="hide">隐藏桌宠</div>
      <div class="ctx-menu-item ctx-menu-danger" data-action="quit">退出程序</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
