name: Release

on:
  push:
    tags:
      - 'v*'  # 匹配 v1.0.0、v1.1.0 等标签

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          name: WindowsPet ${{ github.ref_name }}
          body: |
            ## WindowsPet ${{ github.ref_name }}

            基于 Tauri 2 的 Windows 轻量待办提醒桌宠。

            ### 下载
            - `WindowsPet_*_x64-setup.exe` - NSIS 安装包（推荐）
            - `WindowsPet_*_x64_en-US.msi` - MSI 安装包
            - `WindowsPet.exe` - 单文件免安装版
          files: |
            src-tauri/target/release/WindowsPet.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}